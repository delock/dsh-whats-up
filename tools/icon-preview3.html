<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>What's up · 状态化任务图标预览</title>
<style>
  body{margin:0;padding:24px;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  h2{font-size:14px;margin:28px 0 10px;color:#444}
  h2:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell span{font-size:11px;color:#888}
  .dark{background:#1c2129;padding:20px;border-radius:10px}
  .dark .cell span{color:#9aa4b2}
  .ic{color:#d7dde5}
  .ic.gold{color:#f5c542}
  .ic.dim{color:#8b95a3}
  .side{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#d7dde5}
  .chips{display:flex;gap:5px;margin-left:auto}
  .chip{font-size:10.5px;padding:1px 7px;border-radius:8px;background:rgba(128,138,150,.15);white-space:nowrap}
  .chip.half b{color:#f87171}
  .railbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .railbtn:hover{background:rgba(128,138,150,.18)}
  .badge{position:absolute;top:0;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;line-height:15px;text-align:center}
  .lbl{font-size:11px;color:#9aa4b2;margin-top:6px;text-align:center}
</style>
</head>
<body>

<svg width="0" height="0">
  <defs>
    <g id="bang">
      <path d="M8 2.8 V9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/>
      <circle cx="8" cy="12.4" r="1.15" fill="currentColor"/>
    </g>
    <g id="check">
      <path d="M2.8 8.4 L6.4 12 L13.2 4.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </defs>
</svg>

<h2>三种状态(折叠图标栏形态,深色)</h2>
<div class="dark"><div class="row">
  <div class="cell">
    <div class="railbtn"><svg class="ic gold" width="18" height="18" viewBox="0 0 16 16"><use href="#bang"/></svg><span class="badge">3</span></div>
    <span>有烂尾:金色 ! + 角标</span>
  </div>
  <div class="cell">
    <div class="railbtn"><svg class="ic" width="18" height="18" viewBox="0 0 16 16"><use href="#bang"/></svg></div>
    <span>无烂尾有在做:亮灰 !</span>
  </div>
  <div class="cell">
    <div class="railbtn"><svg class="ic dim" width="18" height="18" viewBox="0 0 16 16"><use href="#check"/></svg></div>
    <span>全部清零:暗灰 ✓</span>
  </div>
</div></div>

<h2>对应的三种侧栏展开态</h2>
<div class="dark" style="display:flex;flex-direction:column;gap:10px;max-width:340px">
  <div class="side">
    <svg class="ic gold" width="16" height="16" viewBox="0 0 16 16"><use href="#bang"/></svg>
    <span>What's up · 在忙啥</span>
    <div class="chips"><span class="chip">📌 在做 <b>18</b></span><span class="chip half">🔴 别忘了 <b>3</b></span></div>
  </div>
  <div class="side">
    <svg class="ic" width="16" height="16" viewBox="0 0 16 16"><use href="#bang"/></svg>
    <span>What's up · 在忙啥</span>
    <div class="chips"><span class="chip">📌 在做 <b>18</b></span></div>
  </div>
  <div class="side" style="opacity:.75">
    <svg class="ic dim" width="16" height="16" viewBox="0 0 16 16"><use href="#check"/></svg>
    <span>What's up · 在忙啥</span>
    <div class="chips"><span class="chip">🟢 无烂尾,天下太平</span></div>
  </div>
</div>

<h2>放大细看</h2>
<div class="dark"><div class="row">
  <div class="cell"><svg class="ic gold" width="40" height="40" viewBox="0 0 16 16"><use href="#bang"/></svg><span>金色 !</span></div>
  <div class="cell"><svg class="ic dim" width="40" height="40" viewBox="0 0 16 16"><use href="#check"/></svg><span>清零 ✓</span></div>
</div></div>

</body>
</html>
