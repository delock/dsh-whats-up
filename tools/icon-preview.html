<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>What's up · 眼睛图标预览</title>
<style>
  body{margin:0;padding:24px;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  h2{font-size:14px;margin:28px 0 10px;color:#444}
  h2:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell span{font-size:11px;color:#888}
  .light{background:#f7f8fa;padding:20px;border-radius:10px}
  .dark{background:#1c2129;padding:20px;border-radius:10px}
  .dark .cell span{color:#9aa4b2}
  .ic{color:#4b5563}
  .dark .ic{color:#d7dde5}
  /* 模拟侧栏一行 */
  .side{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:inherit}
  .chips{display:flex;gap:5px;margin-left:auto}
  .chip{font-size:10.5px;padding:1px 7px;border-radius:8px;background:rgba(128,138,150,.15);white-space:nowrap}
  .chip b{font-weight:700}
  .chip.half b{color:#f87171}
  /* 模拟折叠图标栏按钮 */
  .railbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .railbtn:hover{background:rgba(128,138,150,.18)}
  .badge{position:absolute;top:0;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;line-height:15px;text-align:center}
</style>
</head>
<body>

<!-- 图标本体:双眼(16 viewBox,stroke 1.25 round,同侧栏规格) -->
<svg width="0" height="0">
  <defs>
    <g id="eyes">
      <path d="M1.5 8 Q4 5.6 6.5 8 Q4 10.4 1.5 8 Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M9.5 8 Q12 5.6 14.5 8 Q12 10.4 9.5 8 Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="4.35" cy="7.85" r="0.95" fill="currentColor"/>
      <circle cx="12.35" cy="7.85" r="0.95" fill="currentColor"/>
    </g>
    <g id="eye1">
      <path d="M1.5 8 Q4.25 4.9 7 8 Q4.25 11.1 1.5 8 Q3 6.4 4.6 8 Q3 9.6 1.5 8 Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- 原生风格参照:闹钟(从 GUI bundle 同规格重建) -->
    <g id="clock">
      <circle cx="8" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.25" fill="none"/>
      <path d="M8 6v2.7l1.8 1.1" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" fill="none"/>
      <path d="M5.2 1.6 3.4 3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" fill="none"/>
      <path d="M10.8 1.6 12.6 3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
</svg>

<h2>① 双眼(推荐)— 浅色底</h2>
<div class="light"><div class="row">
  <div class="cell"><svg class="ic" width="16" height="16" viewBox="0 0 16 16"><use href="#eyes"/></svg><span>16</span></div>
  <div class="cell"><svg class="ic" width="20" height="20" viewBox="0 0 16 16"><use href="#eyes"/></svg><span>20</span></div>
  <div class="cell"><svg class="ic" width="28" height="28" viewBox="0 0 16 16"><use href="#eyes"/></svg><span>28</span></div>
  <div class="cell"><svg class="ic" width="40" height="40" viewBox="0 0 16 16"><use href="#eyes"/></svg><span>40</span></div>
  <div class="cell" style="margin-left:24px"><svg class="ic" width="28" height="28" viewBox="0 0 16 16"><use href="#clock"/></svg><span>原生闹钟(对照)</span></div>
</div></div>

<h2>② 双眼 — 深色底(侧栏实际配色)</h2>
<div class="dark"><div class="row">
  <div class="cell"><svg class="ic" width="16" height="16" viewBox="0 0 16 16"><use href="#eyes"/></svg><span>16</span></div>
  <div class="cell"><svg class="ic" width="20" height="20" viewBox="0 0 16 16"><use href="#eyes"/></svg><span>20</span></div>
  <div class="cell"><svg class="ic" width="28" height="28" viewBox="0 0 16 16"><use href="#eyes"/></svg><span>28</span></div>
  <div class="cell" style="margin-left:24px"><svg class="ic" width="28" height="28" viewBox="0 0 16 16"><use href="#clock"/></svg><span>原生闹钟(对照)</span></div>
</div></div>

<h2>③ 侧栏实际效果模拟(展开态)</h2>
<div class="light" style="max-width:340px">
  <div class="side">
    <svg class="ic" width="16" height="16" viewBox="0 0 16 16"><use href="#eyes"/></svg>
    <span>What's up · 在忙啥</span>
    <div class="chips"><span class="chip">📌 在做 <b>18</b></span><span class="chip half">🔴 别忘了 <b>3</b></span></div>
  </div>
</div>
<div style="height:10px"></div>
<div class="dark" style="max-width:340px">
  <div class="side" style="color:#d7dde5">
    <svg class="ic" width="16" height="16" viewBox="0 0 16 16"><use href="#eyes"/></svg>
    <span>What's up · 在忙啥</span>
    <div class="chips"><span class="chip">📌 在做 <b>18</b></span><span class="chip half">🔴 别忘了 <b>3</b></span></div>
  </div>
</div>

<h2>④ 折叠图标栏效果模拟(带角标)</h2>
<div class="dark" style="display:inline-flex;flex-direction:column;gap:8px;padding:12px">
  <div class="railbtn" style="color:#d7dde5"><svg width="18" height="18" viewBox="0 0 16 16"><use href="#eyes"/></svg></div>
  <div class="railbtn" style="color:#d7dde5"><svg width="18" height="18" viewBox="0 0 16 16"><use href="#eyes"/></svg><span class="badge">3</span></div>
  <div class="railbtn" style="color:#d7dde5"><svg width="18" height="18" viewBox="0 0 16 16"><use href="#clock"/></svg></div>
</div>

<h2>⑤ 备选:单眼(更传统的 eye 图标)</h2>
<div class="dark"><div class="row">
  <div class="cell"><svg class="ic" width="20" height="20" viewBox="0 0 16 16"><use href="#eye1"/></svg><span>20</span></div>
  <div class="cell"><svg class="ic" width="28" height="28" viewBox="0 0 16 16"><use href="#eye1"/></svg><span>28</span></div>
</div></div>

</body>
</html>
